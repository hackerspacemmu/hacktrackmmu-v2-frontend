name: Deploy (production)

on:
  push:
    branches: [main]
  workflow_dispatch:

# Never let two production deploys race; queue them instead of cancelling,
# so the last commit on main is always the one that ends up live.
concurrency:
  group: cloudflare-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Build and deploy to Cloudflare Workers
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      # NEXT_PUBLIC_* values are inlined into the client bundle at build time,
      # so they have to be present here rather than as Worker runtime vars.
      - name: Build
        run: npx vinext build
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
          NEXT_PUBLIC_ADMIN_PASSWORD: ${{ secrets.NEXT_PUBLIC_ADMIN_PASSWORD }}
          NEXT_PUBLIC_MEMBER_PASSWORD: ${{ secrets.NEXT_PUBLIC_MEMBER_PASSWORD }}

      - name: Deploy
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail
          npx wrangler deploy \
            --config dist/hacktrackmmu_frontend_v2/wrangler.json \
            --message "${GITHUB_SHA:0:7} $(printf '%s' "${COMMIT_MESSAGE:-manual deploy}" | head -1)" \
            2>&1 | tee deploy.log
          url=$(grep -oE 'https://[A-Za-z0-9._-]+\.workers\.dev' deploy.log | head -1 || true)
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Summary
        env:
          DEPLOY_URL: ${{ steps.deploy.outputs.url }}
        run: |
          {
            echo "### Deployed to production"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Worker | \`hacktrackmmu-frontend-v2\` |"
            echo "| Commit | \`${GITHUB_SHA:0:7}\` |"
            echo "| URL | ${DEPLOY_URL:-see deploy log} |"
          } >> "$GITHUB_STEP_SUMMARY"
